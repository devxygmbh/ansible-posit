# handlers file for workbench

- name: Encrypt OIDC client secret
  when: workbench_server_oidc_client_secret is defined
  ansible.builtin.include_tasks: 01_secret_oidc.yaml

- name: Encrypt Postgresql Password
  when: workbench_database_password is defined
  ansible.builtin.include_tasks: 02_secret_postgresql_password.yaml

- name: Restart rstudio-server service # noqa: ignore-errors
  ansible.builtin.service:
    name: rstudio-server
    state: restarted
    enabled: true
  ignore_errors: true

- name: Restart rstudio-launcher service # noqa: ignore-errors
  ansible.builtin.service:
    name: rstudio-launcher
    state: restarted
    enabled: true
  ignore_errors: true

- name: Reload systemd daemon
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restore context on ensure-home-dir helper
  ansible.builtin.command: restorecon -v /usr/local/sbin/ensure-home-dir.sh
  changed_when: false

- name: Compile and install posit_workbench_ensure_home module
  ansible.builtin.shell: |
    set -euo pipefail
    cd /usr/local/share/selinux
    checkmodule -M -m -o posit_workbench_ensure_home.mod posit_workbench_ensure_home.te
    semodule_package -o posit_workbench_ensure_home.pp -m posit_workbench_ensure_home.mod
    semodule -i posit_workbench_ensure_home.pp
