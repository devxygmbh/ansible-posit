- name: Resolve msodbcsql OS segment
  ansible.builtin.set_fact:
    _msodbcsql_os_segment: >-
      {{
        ('rhel/' ~ ansible_distribution_major_version)
        if ansible_facts['os_family'] == 'RedHat'
        else ('ubuntu/' ~ ansible_distribution_version)
      }}

- name: Resolve msodbcsql baseurl
  ansible.builtin.set_fact:
    _msodbcsql_baseurl: >-
      {{
        (db_drivers_artifactory_base_url ~ '/' ~ db_drivers_msodbcsql_artifactory_repo)
        if db_drivers_artifactory_enabled | bool
        else 'https://packages.microsoft.com'
      }}/{{ _msodbcsql_os_segment }}/prod

- name: Resolve msodbcsql gpgkey URL
  ansible.builtin.set_fact:
    _msodbcsql_gpgkey_url: >-
      {{
        (db_drivers_artifactory_base_url ~ '/' ~ db_drivers_msodbcsql_artifactory_repo)
        if db_drivers_artifactory_enabled | bool
        else 'https://packages.microsoft.com'
      }}/keys/microsoft.asc

- name: Run RHEL msodbcsql tasks
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.import_tasks: 03_msodbcsql_redhat.yaml

- name: Run Ubuntu msodbcsql tasks
  when: ansible_facts['distribution'] == 'Ubuntu'
  ansible.builtin.import_tasks: 03_msodbcsql_ubuntu.yaml

# The Posit task in main.yml overwrites /etc/odbcinst.ini before this role runs,
# and the msodbcsql package's postinst only registers the driver on first install,
# so re-runs of this role lose the [ODBC Driver 18 for SQL Server] section unless
# we re-register it here.
- name: Query registered ODBC drivers
  ansible.builtin.command:
    cmd: odbcinst -q -d
  register: _msodbcsql_odbcinst_query
  changed_when: false

- name: Register msodbcsql18 driver in /etc/odbcinst.ini
  ansible.builtin.command:
    cmd: odbcinst -i -d -f /opt/microsoft/msodbcsql18/etc/odbcinst.ini
  when: "'[ODBC Driver 18 for SQL Server]' not in _msodbcsql_odbcinst_query.stdout"

- name: Configure PATH for mssql-tools
  ansible.builtin.copy:
    content: "export PATH=$PATH:/opt/mssql-tools18/bin\n"
    dest: /etc/profile.d/mssql-tools.sh
    mode: '0644'
