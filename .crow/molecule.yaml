when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: [manual, cron, pull_request]

matrix:
  include:
    - SCENARIO: workbench_default
      WHEN: 'roles/workbench/**'

    - SCENARIO: workbench_artifactory
      WHEN: 'roles/workbench/**'

    - SCENARIO: db_drivers_artifactory
      WHEN: 'roles/db_drivers/**'

    - SCENARIO: db_drivers_msodbcsql_default
      WHEN: 'roles/db_drivers/**'

steps:
  # Unfiltered step so crow always publishes the ci/crow/pr/molecule status,
  # even on PRs that change no role files (where the test step below is
  # path-skipped). Without it the required check is never reported.
  - name: 'noop'
    image: reg.devxy.io/docker.io/library/docker:29-dind
    commands:
      - 'true'

  - name: 'Test ${SCENARIO}'
    image: reg.devxy.io/docker.io/library/docker:29-dind
    privileged: true
    environment:
      # force output of ANSI colors
      PY_COLORS: 1
      DOCKER_HOST: tcp://docker:2375
      ANSIBLE_ROLES_PATH: ./roles
    commands:
      - apk add -q --no-cache uv git curl build-base autoconf automake linux-headers musl-dev libffi-dev openssl-dev openssh yaml-dev ca-certificates
      - uv venv ~/venv/ansible-molecule
      - source ~/venv/ansible-molecule/bin/activate
      - uv pip install -q ansible-doctor ansible-core molecule-plugins[docker] cryptography
      - ansible --version
      - molecule --version
      - cd extensions
      - molecule test --scenario-name ${SCENARIO}
    when:
      - path: ${WHEN}

services:
  docker:
    environment:
      DOCKER_TLS_CERTDIR: ''
    image: reg.devxy.io/docker.io/library/docker:29-dind
    commands: dockerd --tls=false --host=tcp://0.0.0.0:2375
    privileged: true
    ports:
      - 2375
    when:
      - path: ${WHEN}
