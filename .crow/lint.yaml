when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: tag

labels:
  backend: docker

steps:
  - name: editorconfig
    image: cr.codefloe.com/docker.io/mstruebing/editorconfig-checker:4.0.2
    depends_on: []

  - name: prettier
    image: cr.codefloe.com/docker.io/oven/bun:1.4-alpine
    depends_on: []
    commands:
      - bunx prettier@latest --check .

  - name: commitlint
    when:
      - event: pull_request
      - event: pull_request_edited
    image: cr.codefloe.com/docker.io/commitlint/commitlint:21.2.3
    depends_on: []
    commands:
      - echo $${CI_COMMIT_PULL_REQUEST_TITLE} | commitlint
