- name: Verify DB Drivers and msodbcsql Installation from Artifactory
  hosts: all
  become: false
  gather_facts: true

  tasks:
    # --- Posit DB Drivers (existing assertions) ---
    - name: Check if DB drivers directory exists
      ansible.builtin.stat:
        path: '/opt/rstudio-drivers-2025.03.0'
      register: db_drivers_dir

    - name: Verify DB drivers directory exists and is not empty
      ansible.builtin.assert:
        that:
          - db_drivers_dir.stat.exists
          - db_drivers_dir.stat.isdir
        fail_msg: 'DB drivers directory does not exist or is not a directory'
        success_msg: 'DB drivers directory exists'

    - name: Find files in DB drivers directory
      ansible.builtin.find:
        paths: '/opt/rstudio-drivers-2025.03.0'
        file_type: any
        recurse: true
      register: db_drivers_files

    - name: Verify DB drivers directory is not empty
      ansible.builtin.assert:
        that:
          - db_drivers_files.matched > 0
        fail_msg: 'DB drivers directory is empty'
        success_msg: 'DB drivers directory contains {{ db_drivers_files.matched }} items'

    - name: Check if odbcinst.ini exists
      ansible.builtin.stat:
        path: '/etc/odbcinst.ini'
      register: odbcinst_ini

    - name: Verify odbcinst.ini was created
      ansible.builtin.assert:
        that:
          - odbcinst_ini.stat.exists
        fail_msg: 'odbcinst.ini does not exist'
        success_msg: 'odbcinst.ini exists'

    - name: Read odbcinst.ini content
      ansible.builtin.slurp:
        path: '/etc/odbcinst.ini'
      register: odbcinst_content

    - name: Decode and check odbcinst.ini content
      ansible.builtin.set_fact:
        odbcinst_decoded: '{{ odbcinst_content.content | b64decode }}'

    - name: Verify odbcinst.ini contains correct driver paths
      ansible.builtin.assert:
        that:
          - "'rstudio-drivers-2025.03.0' in odbcinst_decoded"
        fail_msg: 'odbcinst.ini does not contain correct driver version paths'
        success_msg: 'odbcinst.ini contains correct driver version paths'

    - name: Check if odbcinst.ini.sample exists in drivers directory
      ansible.builtin.stat:
        path: '/opt/rstudio-drivers-2025.03.0/odbcinst.ini.sample'
      register: odbcinst_sample

    - name: Verify sample odbcinst.ini exists
      ansible.builtin.assert:
        that:
          - odbcinst_sample.stat.exists
        fail_msg: 'odbcinst.ini.sample does not exist in drivers directory'
        success_msg: 'odbcinst.ini.sample exists'

    # --- Microsoft ODBC Driver 18 ---
    - name: Gather package facts for msodbcsql verification
      ansible.builtin.package_facts:
        manager: auto

    - name: Verify msodbcsql18 is installed
      ansible.builtin.assert:
        that:
          - "'msodbcsql18' in ansible_facts.packages"
        fail_msg: 'msodbcsql18 is not installed'
        success_msg: 'msodbcsql18 is installed'

    - name: Verify mssql-tools18 is installed
      ansible.builtin.assert:
        that:
          - "'mssql-tools18' in ansible_facts.packages"
        fail_msg: 'mssql-tools18 is not installed'
        success_msg: 'mssql-tools18 is installed'

    - name: Check sqlcmd binary
      ansible.builtin.stat:
        path: /opt/mssql-tools18/bin/sqlcmd
      register: sqlcmd_stat

    - name: Verify sqlcmd is executable
      ansible.builtin.assert:
        that:
          - sqlcmd_stat.stat.exists
          - sqlcmd_stat.stat.executable
        fail_msg: '/opt/mssql-tools18/bin/sqlcmd does not exist or is not executable'
        success_msg: 'sqlcmd is installed and executable'

    - name: Check profile.d PATH file
      ansible.builtin.stat:
        path: /etc/profile.d/mssql-tools.sh
      register: profile_d_stat

    - name: Verify profile.d PATH file exists
      ansible.builtin.assert:
        that:
          - profile_d_stat.stat.exists
        fail_msg: '/etc/profile.d/mssql-tools.sh does not exist'
        success_msg: '/etc/profile.d/mssql-tools.sh exists'

    - name: Read profile.d PATH file
      ansible.builtin.slurp:
        path: /etc/profile.d/mssql-tools.sh
      register: profile_d_content

    - name: Verify profile.d PATH file references mssql-tools18
      ansible.builtin.assert:
        that:
          - "'/opt/mssql-tools18/bin' in (profile_d_content.content | b64decode)"
        fail_msg: 'profile.d PATH file does not reference /opt/mssql-tools18/bin'
        success_msg: 'profile.d PATH file is correct'

    - name: Verify mssql-release repo file references mock Artifactory (RHEL)
      when: ansible_facts['os_family'] == 'RedHat'
      block:
        - name: Read mssql-release.repo
          ansible.builtin.slurp:
            path: /etc/yum.repos.d/mssql-release.repo
          register: rhel_repo

        - name: Assert RHEL repo points at the mock Artifactory
          ansible.builtin.assert:
            that:
              - "'http://localhost:8080/mssql-release/' in (rhel_repo.content | b64decode)"
            fail_msg: 'mssql-release.repo does not reference the mock Artifactory baseurl'
            success_msg: 'mssql-release.repo references mock Artifactory'

    - name: Verify mssql-release apt source references mock Artifactory (Ubuntu)
      when: ansible_facts['distribution'] == 'Ubuntu'
      block:
        - name: Read mssql-release.list
          ansible.builtin.slurp:
            path: /etc/apt/sources.list.d/mssql-release.list
          register: deb_repo

        - name: Assert apt source points at the mock Artifactory
          ansible.builtin.assert:
            that:
              - "'http://localhost:8080/mssql-release/' in (deb_repo.content | b64decode)"
            fail_msg: 'mssql-release.list does not reference the mock Artifactory baseurl'
            success_msg: 'mssql-release.list references mock Artifactory'
