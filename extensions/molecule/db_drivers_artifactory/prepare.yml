# Prepare phase - Set up a mock Artifactory that serves the Posit
# tarball from disk and forwards /mssql-release/* to packages.microsoft.com.

- name: Prepare mock Artifactory for DB Drivers and msodbcsql
  hosts: all
  gather_facts: true

  tasks:
    - name: Install Python HTTP server dependencies
      ansible.builtin.package:
        name:
          - python3
        state: present

    - name: Create mock Artifactory directory structure
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        mode: '0755'
      loop:
        - /opt/mock-artifactory
        - /opt/mock-artifactory/posit-drivers

    - name: Download DB Drivers to mock Artifactory
      ansible.builtin.get_url:
        url: 'https://cdn.rstudio.com/drivers/7C152C12/installer/rstudio-drivers-2025.03.0.tar'
        dest: '/opt/mock-artifactory/posit-drivers/rstudio-drivers-2025.03.0.tar'
        mode: '0644'
      failed_when: false
      register: download_db_drivers

    - name: Install mock Artifactory proxy script
      ansible.builtin.copy:
        src: files/proxy_server.py
        dest: /opt/mock-artifactory/proxy_server.py
        mode: '0755'

    - name: Start mock Artifactory HTTP server in background
      ansible.builtin.shell: |
        nohup python3 /opt/mock-artifactory/proxy_server.py > /tmp/mock-artifactory.log 2>&1 &
        echo $!
      register: http_server_pid
      changed_when: true

    - name: Wait for HTTP server to be ready
      ansible.builtin.wait_for:
        port: 8080
        delay: 2
        timeout: 30

    - name: Test HTTP server static file accessibility
      ansible.builtin.uri:
        url: 'http://localhost:8080/posit-drivers/rstudio-drivers-2025.03.0.tar'
        return_content: false
      register: http_test_static
      retries: 3
      delay: 5
      until: http_test_static.status == 200

    - name: Test HTTP server proxy forwarding
      ansible.builtin.uri:
        url: 'http://localhost:8080/mssql-release/keys/microsoft.asc'
        return_content: false
      register: http_test_proxy
      retries: 3
      delay: 5
      until: http_test_proxy.status == 200
