# cSpell:ignore checkmake hadolint autofix autoupdate
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
  # - repo: https://github.com/thegeeklab/ansible-doctor
  #   rev: v6.0.2
  #   hooks:
  #     - id: ansible-doctor
  #       files: \.(yaml|yml)$
  #       args: ["roles", "-r"]
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.4
    hooks:
      - id: prettier
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c=.yamllint.yaml]

  - repo: https://github.com/ansible-community/ansible-lint
    rev: v26.6.0
    hooks:
      - id: ansible-lint
        files: \.(yaml|yml)$
        # --offline skips the force-install of the worktree as a collection,
        # which trips ansible-core 2.20.5 over the partial collection mocks
        # ansible-lint generates for `mock_modules` in .ansible-lint.
        args: [--offline]
        additional_dependencies: [distlib]
