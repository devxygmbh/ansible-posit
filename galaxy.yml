### REQUIRED
namespace: devxy

name: posit

version: 1.6.0

readme: README.md

authors:
  - Patrick Schratz <mail@devxy.io>

description: Collection of roles to install Posit applications

license:
  - AGPL-3.0-or-later

# A list of tags you want to associate with the collection for indexing/searching. A tag name has the same character
# requirements as 'namespace' and 'name'
tags: ['tools']

dependencies:
  community.general: '>=10.0.0'

repository: https://codefloe.com/devxy/ansible-posit

# The URL to the homepage of the collection/project
homepage: https://www.devxy.io

# The URL to the collection issue tracker
issues: https://codefloe.com/devxy/ansible-posit/issues

build_ignore:
  # Dev tooling / dotfiles
  - .ansible-lint
  - .crow
  - .editorconfig
  - .gitignore
  - .gitsv
  - .markdownlint-cli2.yaml
  - .markdownlint.yaml
  - .pre-commit-config.yaml
  - .prettierignore
  - .prettierrc.json
  - .vscode
  - .woodpecker
  - .yamllint.yaml
  # Repo-root configs that aren't collection content
  - CLAUDE.md
  - Justfile
  - ansible.cfg
  - commitlint.config.mjs
  - inventory.ini
  - renovate.json
  - requirements.yaml
  - ssh.cfg
  # Doc generation, molecule scenarios, integration tests
  - ansibledoctor
  - extensions
  - test
  - roles/*/tests
  - roles/*/HEADER.md
  - roles/*/.ansibledoctor.yaml
  # Local installs and build artifacts
  - ansible_collections
  - '*.tar.gz'
